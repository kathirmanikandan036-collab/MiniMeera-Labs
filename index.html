<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniMeera AI</title>

  <style>
    :root {
      --bg: #030712;
      --sidebar: #070d1b;
      --panel: #0b1428;
      --border: #172746;
      --blue: #087cff;
      --cyan: #16c8ff;
      --text: #f4f8ff;
      --muted: #8b9bb8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100dvh;
      overflow: hidden;
    }

    /* LEFT DASHBOARD */

    .sidebar {
      width: 265px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand img {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .4px;
    }

    .brand-name span {
      display: block;
      margin-top: 5px;
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .new-chat {
      margin: 22px 0 18px;
      width: 100%;
      padding: 13px;
      border: 1px solid #1269d8;
      border-radius: 10px;
      background: linear-gradient(110deg, #0755bd, #087cff);
      color: white;
      text-align: left;
    }

    .nav-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.5px;
      margin: 18px 10px 9px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      margin: 3px 0;
      color: #c4d1e7;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      text-align: left;
      font-size: 14px;
    }

    .nav-item:hover,
    .nav-item.active {
      color: white;
      background: #101f3a;
      border-color: #19365e;
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      color: var(--cyan);
      font-size: 17px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 8px 3px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #102c54;
      color: var(--cyan);
      border: 1px solid #1d5590;
    }

    .profile small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    /* MAIN CHAT AREA */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(ellipse at 50% 40%,
          rgba(0, 70, 170, .12), transparent 55%),
        var(--bg);
    }

    .topbar {
      height: 67px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      border-bottom: 1px solid var(--border);
      background: rgba(5, 11, 25, .9);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }

    .workspace {
      padding: 7px 11px;
      color: #8dd7ff;
      background: #0b1d36;
      border: 1px solid #17385d;
      border-radius: 7px;
      font-size: 11px;
    }

    .menu-toggle {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 23px;
    }

    .chat-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 28px 20px;
    }

    .welcome {
      margin: auto;
      width: 100%;
      max-width: 690px;
      text-align: center;
      padding: 35px 0;
    }

    .ai-mark {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      margin: 0 auto 26px;
      border: 1px solid #1555a1;
      border-radius: 22px;
      background: linear-gradient(145deg, #0c2a56, #071329);
      box-shadow: 0 0 38px rgba(0, 124, 255, .17);
    }

    .ai-mark img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 39px);
      letter-spacing: -.8px;
    }

    .welcome h1 span {
      color: var(--cyan);
    }

    .welcome p {
      margin: 16px 0 30px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      text-align: left;
    }

    .suggestion {
      padding: 16px;
      color: var(--text);
      background: rgba(10, 23, 45, .85);
      border: 1px solid #1b3152;
      border-radius: 12px;
      text-align: left;
      line-height: 1.5;
    }

    .suggestion:hover {
      background: #102545;
      border-color: #087cff;
    }

    .suggestion strong {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .suggestion span {
      color: var(--muted);
      font-size: 12px;
    }

    .messages {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    .message {
      max-width: 88%;
      padding: 14px 17px;
      margin: 12px 0;
      border-radius: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .message.user {
      margin-left: auto;
      background: #10366b;
      border: 1px solid #1b559c;
    }

    .message.ai {
      background: #0b1426;
      border: 1px solid #1a2b48;
    }

    /* MESSAGE INPUT */

    .composer-area {
      flex-shrink: 0;
      padding: 12px 20px 18px;
      background: linear-gradient(transparent, #030712 18%);
    }

    .composer {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 12px;
      border: 1px solid #24446c;
      border-radius: 16px;
      background: #091326;
      box-shadow: 0 0 25px rgba(0, 90, 220, .06);
    }

    .composer:focus-within {
      border-color: #087cff;
      box-shadow: 0 0 20px rgba(0, 124, 255, .12);
    }

    .composer textarea {
      flex: 1;
      min-width: 0;
      min-height: 43px;
      max-height: 140px;
      padding: 12px 5px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      line-height: 1.5;
    }

    .composer textarea::placeholder {
      color: #7385a4;
    }

    .send-button {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border: 0;
      border-radius: 11px;
      color: white;
      font-size: 23px;
      background: linear-gradient(135deg, #087cff, #00aaff);
    }

    .send-button:hover {
      filter: brightness(1.15);
    }

    .notice {
      text-align: center;
      color: #63738f;
      font-size: 11px;
      margin: 10px 0 0;
    }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: -280px;
        transition: left .2s ease;
        box-shadow: 10px 0 40px #0009;
      }

      .sidebar.open {
        left: 0;
      }

      .menu-toggle {
        display: block;
      }

      .topbar {
        height: 59px;
        padding: 0 13px;
      }

      .topbar h2 {
        font-size: 15px;
      }

      .workspace {
        font-size: 10px;
      }

      .chat-area {
        padding: 15px 13px;
      }

      .welcome {
        padding: 20px 0;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .composer-area {
        padding: 10px 12px 14px;
      }

      .message {
        max-width: 95%;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <!-- Logo path: update only if your actual filename differs -->
        <img src="assets/minimeera-logo.png"
             alt="MiniMeera Labs Logo"
             onerror="this.style.display='none'">

        <div class="brand-name">
          MiniMeera
          <span>LABS</span>
        </div>
      </div>

      <button class="new-chat" onclick="newChat()">
        ＋ &nbsp; New Chat
      </button>

      <div class="nav-label">Workspace</div>

      <button class="nav-item active" onclick="selectSection(this, 'AI Chat')">
        <span class="nav-icon">✳</span> AI Chat
      </button>

      <button class="nav-item" onclick="selectSection(this, 'Chat History')">
        <span class="nav-icon">◷</span> Chat History
      </button>

      <div class="nav-label">Developer Tools</div>

      <button class="nav-item" onclick="selectSection(this, 'Dashboard')">
        <span class="nav-icon">▦</span> Dashboard
      </button>

      <button class="nav-item" onclick="selectSection(this, 'API Keys')">
        <span class="nav-icon">⌘</span> API Keys
      </button>

      <button class="nav-item" onclick="selectSection(this, 'Usage')">
        <span class="nav-icon">◉</span> Usage
      </button>

      <div class="sidebar-bottom">
        <button class="nav-item" onclick="selectSection(this, 'Settings')">
          <span class="nav-icon">⚙</span> Settings
        </button>

        <div class="profile">
          <div class="avatar">M</div>
          <div>
            <strong>MiniMeera User</strong>
            <small>Personal Workspace</small>
          </div>
        </div>
      </div>

    </aside>

    <main class="main">

      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle"
                  onclick="toggleSidebar()"
                  aria-label="Toggle dashboard">☰</button>

          <h2 id="pageTitle">MiniMeera AI</h2>
        </div>

        <span class="workspace">● MiniMeera Workspace</span>
      </header>

      <section class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">

          <div class="ai-mark">
            <img src="assets/minimeera-logo.png"
                 alt="MiniMeera AI"
                 onerror="this.parentElement.innerHTML='<span style=&quot;color:#16c8ff;font-size:29px;font-weight:bold&quot;>ML</span>'">
          </div>

          <h1>Welcome to <span>MiniMeera AI</span></h1>

          <p>
            Your AI workspace starts here.<br>
            What would you like to explore today?
          </p>

          <div class="suggestions">

            <button class="suggestion"
                    onclick="useSuggestion('Help me understand artificial intelligence')">
              <strong>✳ Explore AI</strong>
              <span>Understand ideas and learn something new.</span>
            </button>

            <button class="suggestion"
                    onclick="useSuggestion('Help me plan a software project')">
              <strong>⌘ Build Something</strong>
              <span>Plan your next software project.</span>
            </button>

            <button class="suggestion"
                    onclick="useSuggestion('Help me write and improve my ideas')">
              <strong>✎ Writing & Ideas</strong>
              <span>Organize your thoughts and drafts.</span>
            </button>

            <button class="suggestion"
                    onclick="useSuggestion('Explain a technical topic step by step')">
              <strong>▤ Learn Step by Step</strong>
              <span>Break down a difficult technical topic.</span>
            </button>

          </div>
        </div>

        <div class="messages" id="messages"></div>

      </section>

      <footer class="composer-area">

        <form class="composer" id="chatForm">
          <textarea id="prompt"
                    rows="1"
                    placeholder="Message MiniMeera AI..."
                    aria-label="Message MiniMeera AI"></textarea>

          <button class="send-button"
                  type="submit"
                  aria-label="Send message">↑</button>
        </form>

        <p class="notice">
          MiniMeera AI Preview · AI services are not connected yet.
        </p>

      </footer>

    </main>
  </div>

  <script>
    const promptBox = document.getElementById("prompt");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const chatArea = document.getElementById("chatArea");

    document.getElementById("chatForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const text = promptBox.value.trim();
      if (!text) return;

      welcome.style.display = "none";
      addMessage(text, "user");

      addMessage(
        "Your message has been received by this interface. The MiniMeera AI engine has not been connected yet.",
        "ai"
      );

      promptBox.value = "";
      promptBox.style.height = "auto";
      chatArea.scrollTop = chatArea.scrollHeight;
    });

    function addMessage(text, role) {
      const message = document.createElement("div");
      message.className = "message " + role;
      message.textContent = text;
      messages.appendChild(message);
    }

    function useSuggestion(text) {
      promptBox.value = text;
      promptBox.focus();
      promptBox.dispatchEvent(new Event("input"));
    }

    function newChat() {
      messages.innerHTML = "";
      welcome.style.display = "block";
      promptBox.value = "";
      promptBox.style.height = "auto";
      document.getElementById("pageTitle").textContent = "MiniMeera AI";
      closeSidebarOnMobile();
    }

    function selectSection(button, section) {
      document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      document.getElementById("pageTitle").textContent = section;

      if (section !== "AI Chat") {
        alert(section + " is a dashboard placeholder. We will build its functionality in a later step.");
      }

      closeSidebarOnMobile();
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    function closeSidebarOnMobile() {
      if (window.innerWidth <= 700) {
        document.getElementById("sidebar").classList.remove("open");
      }
    }

    promptBox.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 140) + "px";
    });

    promptBox.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.getElementById("chatForm").requestSubmit();
      }
    });
  </script>
</body>
</html>
